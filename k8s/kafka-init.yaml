apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: streaming
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do sleep 2; done"]
      containers:
        - name: kafka-init
          image: apache/kafka:3.9.1
          command:
            - /opt/kafka/bin/kafka-topics.sh
            - --bootstrap-server
            - kafka:9092
            - --create
            - --if-not-exists
            - --topic
            - events
            - --partitions
            - "2"
            - --replication-factor
            - "1"
