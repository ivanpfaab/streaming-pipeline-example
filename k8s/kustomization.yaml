apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: streaming
resources:
  - namespace.yaml
  - kafka.yaml
  - kafka-init.yaml
  - input-configmap.yaml
  # Swap to processor-spark.yaml (and streaming-spark below) for Spark.
  - processor-flink.yaml
  - clients.yaml
images:
  - name: IMAGE_PROCESSOR
    newName: streaming-flink
    newTag: latest
  - name: IMAGE_CLIENT
    newName: streaming-client
    newTag: latest
