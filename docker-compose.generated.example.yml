# Example output of scripts/generate-compose.py.
# Regenerate locally with: python scripts/generate-compose.py
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    profiles: [server]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.1
    profiles: [server]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - events
      - --partitions
      - "2"
      - --replication-factor
      - "1"
  flink:
    profiles: [server]
    build:
      context: .
      dockerfile: server/flink/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: events
      OUTPUT_DIR: /data/output
    volumes:
      - ./data/output:/data/output
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  client-1:
    profiles: [client]
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      INPUT_PATH: /data/input/sample.csv
      ROWS_PER_SECOND: "5"
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: events
      CLIENT_ID: client-1
    volumes:
      - ./data/input:/data/input:ro
  client-2:
    profiles: [client]
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      INPUT_PATH: /data/input/events.csv
      ROWS_PER_SECOND: "5"
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: events
      CLIENT_ID: client-2
    volumes:
      - ./data/input:/data/input:ro
