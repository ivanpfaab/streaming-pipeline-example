# Example output of scripts/generate-compose.py.
# Regenerate locally with: python scripts/generate-compose.py
services:
  kafka:
    image: bitnami/kafka:3.8
    profiles: [server]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
  flink:
    profiles: [server]
    build:
      context: .
      dockerfile: server/flink/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: events
      OUTPUT_DIR: /data/output
    volumes:
      - ./data/output:/data/output
    depends_on:
      kafka:
        condition: service_healthy
  client-1:
    profiles: [client]
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      INPUT_PATH: /data/input/sample.csv
      ROWS_PER_SECOND: "5"
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: events
      CLIENT_ID: client-1
    volumes:
      - ./data/input:/data/input:ro
  client-2:
    profiles: [client]
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      INPUT_PATH: /data/input/events.csv
      ROWS_PER_SECOND: "5"
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: events
      CLIENT_ID: client-2
    volumes:
      - ./data/input:/data/input:ro
